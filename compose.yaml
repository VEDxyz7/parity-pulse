services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATA_MODE: ${DATA_MODE:-DEMO}
      EXECUTION_MODE: ${EXECUTION_MODE:-DRY_RUN}
      APPROVAL_MODE: ${APPROVAL_MODE:-PROPOSE_ONLY}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      REQUIRE_SIMULATION: ${REQUIRE_SIMULATION:-true}
      DATABASE_URL: sqlite:////app/var/parity-pulse.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - parity_data:/app/var
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  parity_data:
